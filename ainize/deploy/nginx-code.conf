# ainize.ai/code — paste inside the `server { server_name ainize.ai … listen 443 ssl; }` block of
# /etc/nginx/sites-available/ainize.ai, ABOVE `location / { … }`.
#
# The prefix is kept (proxy_pass without a URI part): AinCode is served under /code by design.

location = /code { return 302 /code/$is_args$args; }

location /code/ {
    proxy_pass http://127.0.0.1:3950;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # the terminal is a WebSocket
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # model output and the event stream are streamed; an agent turn can take minutes
    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    client_max_body_size 100m;
}

# And once, at http{} level (e.g. /etc/nginx/conf.d/websocket-upgrade.conf), if it is not defined already:
#
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
